services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    networks:
      - odoo-net

  odoo:
    image: odoo:17
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8069:8069"   # Ana HTTP arayüzü
      - "8072:8072"   # Canlı güncelleme (WebSocket / longpolling)
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      # Otomatik giriş kullanıcısı ve şifresi (değiştirilebilir)
      AUTO_LOGIN_USER: ${AUTO_LOGIN_USER:-admin}
      AUTO_LOGIN_PASS: ${AUTO_LOGIN_PASS:-admin}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    networks:
      - odoo-net

volumes:
  odoo-db-data:
  odoo-web-data:

networks:
  odoo-net:
